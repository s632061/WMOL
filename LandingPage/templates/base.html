<!doctype html>
<html lang="en" data-wmol-release="desktop-finish-29">
  <head>
    <meta name="view-transition" content="same-origin">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/static/css/styles.css?v=wmol-desktop-finish-29">
    <script>
      (function () {
        var root = document.documentElement;
        var phone = false;
        var wasLandscape = false;
        var portraitHeight = 0;
        var frame = 0;
        var lastSize = "";
        var stored;
        var gestureActive = false;
        var resumeTimer = 0;
        // Pinch zoom changes the visual viewport, not the layout we should fit to.
        // Leave native zoom/pan untouched and pause our responsive measurements.
        function zoomIsActive() {
          var viewport = window.visualViewport;
          return gestureActive || !!(viewport && Math.abs(viewport.scale - 1) > 0.02);
        }
        window.wmolZoomIsActive = zoomIsActive;
        function resumeLayout() {
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(function () {
            if (zoomIsActive()) return;
            syncPhoneMode();
            window.dispatchEvent(new Event("wmol:viewport"));
          }, 100);
        }
        document.addEventListener("touchstart", function (event) {
          if (event.touches.length > 1) gestureActive = true;
        }, {passive: true});
        function finishTouches(event) {
          if (event.touches.length < 2 && gestureActive) {
            gestureActive = false;
            resumeLayout();
          }
        }
        document.addEventListener("touchend", finishTouches, {passive: true});
        document.addEventListener("touchcancel", finishTouches, {passive: true});
        document.addEventListener("gesturestart", function () {gestureActive = true;}, {passive: true});
        document.addEventListener("gestureend", function () {gestureActive = false; resumeLayout();}, {passive: true});
        function syncSurface() {
          var surface = document.getElementById("wmol-landing") ? "home"
            : document.getElementById("wmol-medicine") ? "medicine"
            : document.getElementById("wmol-tools") ? "tools"
            : document.querySelector(".domains-page") ? "domains"
            : document.querySelector(".hsk-page") ? "hsk"
            : document.querySelector(".aws5-page") ? "aws" : "other";
          root.dataset.wmolSurface = surface;
          if (!phone) return;
          if (surface === "home" || surface === "domains") {
            // One flat theme-color cannot match both ends of the bronze texture.
            // Let browser chrome derive its treatment from the actual page.
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {meta.remove();});
            return;
          }
          var color = surface === "home" || surface === "domains" ? "#342515"
            : surface === "medicine" ? "#f8f4e9" : surface === "tools" ? "#000000"
            : surface === "hsk" ? "#080909" : surface === "aws" ? "#06192f" : "#020826";
          if (surface === "hsk" || surface === "aws") {
            var ownPage = document.querySelector(surface === "hsk" ? ".hsk-page" : ".aws5-page");
            var ownColor = ownPage && getComputedStyle(ownPage).backgroundColor;
            if (ownColor && ownColor !== "rgba(0, 0, 0, 0)" && ownColor !== "transparent") color = ownColor;
            root.style.setProperty("--wmol-page-edge-color", color);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {meta = document.createElement("meta"); meta.name = "theme-color"; document.head.appendChild(meta);}
          meta.content = color;
        }
        try { stored = JSON.parse(sessionStorage.getItem("wmol-portrait-size") || "null"); } catch (_) {}

        function syncPhoneMode() {
          var sw = (window.screen && window.screen.width) || window.innerWidth;
          var sh = (window.screen && window.screen.height) || window.innerHeight;
          var shortSide = Math.min(sw, sh);
          phone = phone || ((navigator.maxTouchPoints || 0) > 0 && shortSide <= 600);
          root.classList.toggle("wmol-phone-device", phone);
          if (!phone || zoomIsActive()) return;
          var orientationType = window.screen.orientation && window.screen.orientation.type;
          var sideways = typeof window.orientation === "number" ? Math.abs(window.orientation) === 90
            : orientationType ? orientationType.indexOf("landscape") === 0
            : window.innerWidth > window.innerHeight;
          var visual = window.visualViewport;
          var viewHeight = visual && Math.abs(visual.scale - 1) < 0.01
            ? Math.min(window.innerHeight, visual.height) : window.innerHeight;
          var designWidth = Math.min(shortSide, 430);
          root.classList.toggle("wmol-phone-compact", shortSide <= 420);
          var editing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
          if (!sideways && window.innerHeight > window.innerWidth && !editing) {
            portraitHeight = viewHeight;
            try { sessionStorage.setItem("wmol-portrait-size", JSON.stringify({width: designWidth, height: portraitHeight})); } catch (_) {}
          } else if (!portraitHeight) {
            portraitHeight = stored && Math.abs(stored.width - designWidth) < 1 && stored.height >= designWidth && stored.height <= Math.max(sw, sh)
              ? stored.height : Math.max(sw, sh);
          }
          // The narrow phone layout keeps its portrait proportions. Only the
          // visible scrolling window becomes shorter when the phone turns sideways.
          root.style.setProperty("--wmol-phone-design-w", designWidth + "px");
          root.style.setProperty("--wmol-phone-design-h", Math.max(sw, sh) + "px");
          root.style.setProperty("--wmol-phone-layout-h", portraitHeight + "px");
          root.style.setProperty("--wmol-phone-visible-h", viewHeight + "px");
          root.classList.toggle("wmol-phone-landscape", sideways);
          var signature = [designWidth, portraitHeight, viewHeight, sideways].join(":");
          if (signature !== lastSize) {
            lastSize = signature;
            var returnedUpright = !sideways && wasLandscape;
            if (frame) cancelAnimationFrame(frame);
            frame = requestAnimationFrame(function () {
              frame = 0;
              window.dispatchEvent(new Event("wmol:viewport"));
              if (returnedUpright) window.dispatchEvent(new Event("wmol:portrait"));
            });
          }
          wasLandscape = sideways;
        }
        syncPhoneMode();
        document.addEventListener("DOMContentLoaded", function () {syncPhoneMode(); syncSurface();});
        window.addEventListener("resize", syncPhoneMode, {passive: true});
        window.addEventListener("orientationchange", syncPhoneMode, {passive: true});
        window.addEventListener("pageshow", syncPhoneMode, {passive: true});
        if (window.visualViewport) window.visualViewport.addEventListener("resize", syncPhoneMode, {passive: true});
        if (window.screen.orientation && window.screen.orientation.addEventListener) {
          window.screen.orientation.addEventListener("change", syncPhoneMode);
        }
      })();
    </script>
    <script>
    /* One navigation owner: native cross-document morphs, with a fade fallback. */
    (() => {
      const root = document.documentElement;
      const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
      const nativeNavigation = 'onpageswap' in window && 'onpagereveal' in window;
      const core = path => ['/domains/', '/tools/', '/medicine/'].includes(path);
      const pathOf = url => { if (!url) return ''; try { return new URL(url, location.href).pathname; } catch (_) { return ''; } };
      const read = key => { try { return sessionStorage.getItem(key); } catch (_) { return null; } };
      const write = (key, value) => { try { sessionStorage.setItem(key, value); } catch (_) {} };
      let busy = false, incoming = null, exitMotion = null;
      try { incoming = JSON.parse(read('wmol-navigation') || 'null'); } catch (_) {}
      if (!incoming || incoming.to !== location.pathname || Date.now() - incoming.time > 15000) incoming = null;
      const compact = () => root.classList.contains('wmol-phone-device') || innerWidth <= 900 || innerHeight >= innerWidth;
      const syncMode = () => { root.dataset.wmolNavMode = compact() ? 'fade' : 'morph'; };
      syncMode();
      window.addEventListener('resize', syncMode, {passive:true});
      window.wmolNavigationUsesFade = compact;
      window.wmolPlainClick = event => !event.defaultPrevented && event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;
      if (incoming && incoming.fallback && !reduceMotion()) root.dataset.wmolFallbackEntry = 'true';
      // Browser Back/Forward also suppresses the unrelated first-visit panel entrance.
      const previous = pathOf(window.navigation?.activation?.from?.url || incoming?.from || '');
      if (location.pathname === '/domains/' && previous === '/tools/') write('closingToHome', '1');

      let settleReveal;
      let revealed = new Promise(resolve => { settleReveal = resolve; });
      window.wmolAfterPageReveal = callback => revealed.then(transition => transition ? transition.finished.catch(() => {}) : undefined).then(callback);
      window.addEventListener('pagereveal', event => {
        busy = false;
        if (exitMotion) {exitMotion.cancel(); exitMotion = null;}
        document.body.style.pointerEvents = '';
        syncMode();
        const from = pathOf(window.navigation?.activation?.from?.url || incoming?.from || '');
        const returning = location.pathname === '/domains/' && (from === '/tools/' || window.wmolDomainsShouldEnter === false);
        if (returning) window.wmolPrepareDomainsReturn?.();
        const transition = event.viewTransition;
        const activeRoute = core(location.pathname) && (core(from) || !!incoming);
        if (transition && (reduceMotion() || !activeRoute)) transition.skipTransition();
        if (transition) transition.ready.catch(() => {});
        delete root.dataset.wmolFallbackEntry;
        if (!transition && activeRoute && !reduceMotion()) {
          document.body.animate([{opacity:0}, {opacity:1}], {duration:260, easing:'ease-out'});
        }
        settleReveal(transition);
        window.wmolPageTransition = transition;
        if (returning && transition && !compact() && !reduceMotion()) {
          transition.ready.then(() => window.wmolContinueDomainsReturn?.(transition)).catch(() => {});
        }
      });
      window.addEventListener('pageswap', event => {
        revealed = new Promise(resolve => {settleReveal = resolve;});
        window.wmolPageTransition = null;
        const to = pathOf(event.activation?.entry?.url || '');
        if (location.pathname === '/tools/' && to === '/domains/') write('closingToHome', '1');
        if (event.viewTransition) event.viewTransition.ready.catch(() => {});
        if (event.viewTransition && (reduceMotion() || !core(location.pathname) || !core(to))) event.viewTransition.skipTransition();
      });
      window.addEventListener('pageshow', event => {
        busy = false;
        if (exitMotion) {exitMotion.cancel(); exitMotion = null;}
        document.body.style.pointerEvents = '';
        if (!nativeNavigation) {
          delete root.dataset.wmolFallbackEntry;
          if (incoming && !reduceMotion()) document.body.animate([{opacity:0}, {opacity:1}], {duration:260, easing:'ease-out'});
          settleReveal(null);
          if (event.persisted && location.pathname === '/domains/') window.wmolPrepareDomainsReturn?.();
        }
      });
      window.wmolNavigate = async (url, options = {}) => {
        if (busy) return;
        busy = true;
        const destination = new URL(url, location.href);
        syncMode();
        const mode = compact() ? 'fade' : 'morph';
        const remember = () => {
          write('wmol-navigation', JSON.stringify({from:location.pathname, to:destination.pathname, mode, fallback:!nativeNavigation, time:Date.now()}));
          if (destination.pathname === '/domains/') write('closingToHome', '1');
        };
        try {
          if (window.wmolPageTransition) {
            // A deliberate new desktop navigation should not wait for a decorative tail.
            if (mode === 'morph') window.wmolPageTransition.skipTransition();
            await window.wmolPageTransition.finished.catch(() => {});
          }
          // The outgoing and incoming banner snapshots share one native timeline.
          // Never slide live panels away first and then start a second page morph.
          if (!nativeNavigation && !reduceMotion()) {
            exitMotion = document.body.animate([{opacity:1}, {opacity:0}], {duration:180, easing:'ease-in', fill:'forwards'});
            await exitMotion.finished.catch(() => {});
          }
        } finally {
          remember();
          location.assign(destination.href);
        }
      };
    })();
    </script>

    <div class="wmol-phone-backdrop" aria-hidden="true"></div>
    <main>
      {% block content %}{% endblock %}

    <script>
    (() => {
      'use strict';
      const pattern=/^(?:a|your) way to always know what to (?:do|learn) next[.!]?$/i;
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      function fit(el) {
        if(!el.getClientRects().length)return;
        if (el.classList.contains('wml-learning-tagline') && !document.documentElement.classList.contains('wmol-phone-device')) {
          ['font-size','white-space','text-wrap'].forEach(prop => el.style.removeProperty(prop));
          return;
        }
        el.style.setProperty('display','block','important');
        el.style.setProperty('white-space','nowrap','important');
        el.style.setProperty('text-wrap','nowrap','important');
        el.querySelectorAll('br').forEach(br=>br.replaceWith(document.createTextNode(' ')));
        el.style.removeProperty('font-size');
        const cs=getComputedStyle(el),base=parseFloat(cs.fontSize);
        const text=el.textContent.trim().replace(/\s+/g,' ');
        const width=el.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)-4;
        if(!ctx||width<=0||!base)return;
        ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${base}px ${cs.fontFamily}`;
        const natural=ctx.measureText(text).width+(parseFloat(cs.letterSpacing)||0)*Math.max(0,text.length-1);
        el.style.setProperty('font-size',`${Math.max(1,Math.min(base,base*width/Math.max(1,natural)))}px`,'important');
      }
      window.wmolFitTaglines=(scope=document)=>{
        if(window.wmolZoomIsActive&&window.wmolZoomIsActive())return;
        scope.querySelectorAll('[data-wmol-one-line]').forEach(fit);
      };
      function init(){
        document.querySelectorAll('p,h1,h2,h3,h4,span,div').forEach(el=>{
          if(pattern.test(el.textContent.trim().replace(/\s+/g,' '))&&![...el.children].some(c=>pattern.test(c.textContent.trim().replace(/\s+/g,' '))))el.setAttribute('data-wmol-one-line','');
        });
        let frame=0;
        const schedule=()=>{if(frame)cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{frame=0;window.wmolFitTaglines();});};
        ['resize','pageshow','wmol:viewport','wmol:portrait'].forEach(type=>window.addEventListener(type,schedule,{passive:true}));
        if(document.fonts)document.fonts.ready.then(schedule);
        if(window.ResizeObserver){
          const widths=new WeakMap();
          const observer=new ResizeObserver(entries=>{let changed=false;entries.forEach(e=>{if(Math.abs((widths.get(e.target)||0)-e.contentRect.width)>.5){widths.set(e.target,e.contentRect.width);changed=true;}});if(changed)schedule();});
          document.querySelectorAll('[data-wmol-one-line]').forEach(el=>observer.observe(el.parentElement));
        }
        window.wmolFitTaglines();
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
    })();
    </script>
    <script>
/* Width-dependent finishing only. No saved one-off offsets or physical-monitor sizing. */
(() => {
  'use strict';
  let raf = 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function fullTextWidth(el, fontPx) {
    const cs = getComputedStyle(el);
    const text = el.textContent.trim().replace(/\s+/g, ' ');
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${fontPx}px ${cs.fontFamily}`;
    return ctx.measureText(text).width + (parseFloat(cs.letterSpacing) || 0) * Math.max(0, text.length - 1);
  }
  function fitSingleLine(el, minimum = 12) {
    if (!el || !el.getClientRects().length) return;
    el.style.removeProperty('font-size');
    el.style.removeProperty('white-space');
    const cs = getComputedStyle(el);
    const base = parseFloat(cs.fontSize);
    const width = el.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0) - 4;
    if (width <= 0) return;
    const needed = fullTextWidth(el, base);
    const fit = Math.min(base, base * width / Math.max(1, needed));
    el.style.setProperty('font-size', `${Math.max(minimum, fit)}px`, 'important');
    // If an accessibility text size exceeds the safe minimum, wrap rather than clip.
    el.style.setProperty('white-space', fit >= minimum ? 'nowrap' : 'normal', 'important');
  }
  // Desktop-only finishing. Phone DOM and native-zoom behaviour are unchanged.
  function syncDesktopPass(page) {
    const wrap = (head, selector) => {
      if (!head || head.querySelector(':scope > .pass-desktop-copy-group')) return;
      const children = Array.from(head.children).filter(el => el.matches(selector));
      if (!children.length) return;
      const group = document.createElement('div'); group.className = 'pass-desktop-copy-group';
      children[0].before(group); children.forEach(el => group.appendChild(el));
    };
    wrap(page.querySelector('.pass-proof-testimonials .pass-proof-head'), '.pass-proof-lead');
    wrap(page.querySelector('.pass-publications-head'), '.pass-publications-intro, .pass-publications-points');
    // Centre each left-aligned body by trimming only unused line-end space.
    // Never create another wrapped line just to make a block narrower.
    page.querySelectorAll('.pass-desktop-copy-group').forEach(group => {
      const available = Math.max(0, group.parentElement.clientWidth - 16);
      if (!available) return;
      group.style.setProperty('width', available + 'px', 'important');
      const initialHeight = group.offsetHeight;
      const rect = group.getBoundingClientRect();
      const scale = rect.width / Math.max(1, group.offsetWidth);
      const walker = document.createTreeWalker(group, NodeFilter.SHOW_TEXT);
      let node, right = rect.left;
      while ((node = walker.nextNode())) {
        if (!node.textContent.trim()) continue;
        const range = document.createRange(); range.selectNodeContents(node);
        for (const r of range.getClientRects()) if (r.width > 0) right = Math.max(right, r.right);
      }
      const fitted = Math.min(available, Math.ceil((right - rect.left) / scale + 6));
      if (fitted > 0) group.style.setProperty('width', fitted + 'px', 'important');
      if (group.offsetHeight > initialHeight + 1) group.style.setProperty('width', available + 'px', 'important');
    });
    // Both proof headings use the same fitted size, not two unrelated scales.
    const titles = Array.from(page.querySelectorAll('.pass-proof-head h3'));
    titles.forEach(el => {el.style.removeProperty('font-size'); el.style.removeProperty('white-space');});
    if (titles.length) {
      let size = Math.min(...titles.map(el => parseFloat(getComputedStyle(el).fontSize)));
      titles.forEach(el => { size = Math.min(size, size * Math.max(1, el.clientWidth - 6) / Math.max(1, fullTextWidth(el, size))); });
      titles.forEach(el => {
        el.style.setProperty('font-size', `${Math.max(24, size)}px`, 'important');
        el.style.setProperty('white-space', size >= 24 ? 'nowrap' : 'normal', 'important');
      });
    }
    const media = page.querySelector('.pass-transition-media');
    const frame = page.querySelector('.pass-transition-frame');
    const copy = page.querySelector('.pass-what-copy');
    if (media && frame && copy) {
      copy.style.removeProperty('--pass-product-top-space');
      const sideBySide = getComputedStyle(page.querySelector('.pass-transition-grid')).gridTemplateColumns.trim().split(/\s+/).length === 2;
      // Centre to the image itself, excluding the thumbnail/caption rows below it.
      const gap = sideBySide ? Math.max(0, (frame.offsetHeight - copy.offsetHeight) / 2) : 0;
      copy.style.setProperty('--pass-product-top-space', `${gap}px`);
    }
    // Enlarge short one-line statements toward their card/grid boundaries.
    // Do not justify/stretch letters or force a multiline sentence onto one line.
    const fill = (el, maximum) => {
      if (!el) return;
      el.style.removeProperty('font-size');
      const css = getComputedStyle(el), base = parseFloat(css.fontSize);
      const measured = fullTextWidth(el, base);
      const available = el.clientWidth - (parseFloat(css.paddingLeft)||0) - (parseFloat(css.paddingRight)||0) - 8;
      if (available > measured && measured > 0) {
        el.style.setProperty('font-size', `${base * Math.min(maximum, available / measured)}px`, 'important');
      }
    };
    fill(page.querySelector('.pass-system-description'), 1.18);
    fill(page.querySelector('[aria-labelledby="pass-program-title"] .pass-section-head > p:last-child'), 1.18);
    const close = page.querySelector('.pass-fit-close');
    if (close && getComputedStyle(close).display === 'flex') {
      close.style.removeProperty('font-size');
      const css = getComputedStyle(close), base = parseFloat(css.fontSize);
      const words = [...close.children].reduce((sum, el) => sum + fullTextWidth(el, base), 0);
      const available = close.clientWidth - (parseFloat(css.columnGap) || 20) - 8;
      if (words > 0 && available > 0) close.style.setProperty('font-size',
        `${Math.max(16, base * Math.min(1.22, available / words))}px`, 'important');
    } else fill(close, 1.22);
  }
  function syncPass() {
    if (window.wmolZoomIsActive && window.wmolZoomIsActive()) return;
    const page = document.querySelector('#wmol-medicine .pass-page');
    if (!page) return;
    const phone = document.documentElement.classList.contains('wmol-phone-device');
    if (phone) {
      // Group related short lines only on phones; desktop DOM/layout stays unchanged.
      const wrap = (parent, selector) => {
        if (!parent || parent.querySelector(':scope > .pass-mobile-copy-group')) return;
        const children = Array.from(parent.children).filter(el => el.matches(selector));
        if (!children.length) return;
        const group = document.createElement('div');
        group.className = 'pass-mobile-copy-group';
        group.dataset.mobileGroupFit = '';
        children[0].before(group);
        children.forEach(el => group.appendChild(el));
      };
      wrap(page.querySelector('.pass-proof-testimonials .pass-proof-head'), '.pass-proof-lead');
      wrap(page.querySelector('.pass-publications-head'), '.pass-publications-intro, .pass-publications-points');
    }
    page.querySelectorAll('[data-mobile-group-fit]').forEach(group => {
      group.style.removeProperty('width');
      if (group.closest('.pass-proof-grid')) return;
      if (!phone) return;
      const children = Array.from(group.querySelectorAll('p, li'));
      const available = group.parentElement.clientWidth;
      if (!children.length || !available) return;
      let needed = Math.max(...children.map(el => fullTextWidth(el, parseFloat(getComputedStyle(el).fontSize))));
      // Include list markers/padding without changing their indent.
      const list = group.querySelector('ul');
      if (list) needed += parseFloat(getComputedStyle(list).paddingLeft) || 0;
      group.style.setProperty('width', `${Math.min(available, Math.ceil(needed + 4))}px`, 'important');
    });
    const desktop = !phone && innerWidth > 700;
    if (desktop) syncDesktopPass(page);
    else {
      page.querySelectorAll('.pass-desktop-copy-group').forEach(group => group.replaceWith(...group.childNodes));
      page.querySelectorAll('.pass-proof-head h3, .pass-system-description, [aria-labelledby="pass-program-title"] .pass-section-head > p:last-child, .pass-fit-close').forEach(el => {el.style.removeProperty('font-size');el.style.removeProperty('white-space');});
      fitSingleLine(page.querySelector('#pass-publications-title'), 13);
    }
    fitSingleLine(page.querySelector('.pass-contact-copy h2'), 12);
    if (phone) {
      // Trim only unused end-of-line space, not the reading measure itself.
      // The block remains left aligned; equal auto margins center the whole group.
      const targets = page.querySelectorAll('.pass-what-points, .pass-use-summary, .pass-system-description, .pass-section-head > p:not(.pass-section-kicker), .pass-fit-intro, .pass-mobile-copy-group');
      Array.from(new Set(targets)).forEach(group => {
        if (group.closest('.pass-proof-grid')) {group.style.removeProperty('width'); return;}
        let maxWidth = group.parentElement.clientWidth;
        if (!maxWidth) return;
        if (group.matches('.pass-what-points, .pass-mobile-copy-group')) {
          // Inset once at the grouped body, never at each nested paragraph.
          maxWidth -= Math.min(24, maxWidth * .06);
          if (group.closest('.pass-proof-testimonials')) {
            const card = page.querySelector('.testimonial-card');
            if (card && card.clientWidth) maxWidth = Math.min(maxWidth, card.clientWidth);
          }
        }
        group.style.setProperty('width', `${maxWidth}px`, 'important');
        const oldHeight = group.offsetHeight;
        const box = group.getBoundingClientRect();
        const walker = document.createTreeWalker(group, NodeFilter.SHOW_TEXT);
        let node, right = box.left;
        while ((node = walker.nextNode())) {
          if (!node.textContent.trim()) continue;
          const range = document.createRange(); range.selectNodeContents(node);
          Array.from(range.getClientRects()).forEach(rect => {if (rect.width > 0) right = Math.max(right, rect.right);});
        }
        const minimum = group.hasAttribute('data-mobile-group-fit') ? 0 : maxWidth * .92;
        const fitted = Math.min(maxWidth, Math.max(minimum, Math.ceil(right - box.left + 3)));
        if (fitted > 0) group.style.setProperty('width', `${fitted}px`, 'important');
        // Never add an extra line merely to center the body visually.
        if (group.offsetHeight > oldHeight + 2) group.style.setProperty('width', `${maxWidth}px`, 'important');
      });
    }
    // Keep the requested two-line title at its largest non-overflowing size.
    const heading = page.querySelector('#pass-title');
    if (heading) {
      heading.style.removeProperty('font-size');
      const baseSize = parseFloat(getComputedStyle(heading).fontSize);
      const lines = Array.from(heading.querySelectorAll('.pass-title-line'));
      const needed = Math.max(1, ...lines.map(line => fullTextWidth(line, baseSize)));
      const available = Math.max(1, heading.clientWidth - 8);
      heading.style.setProperty('font-size', `${Math.min(baseSize, baseSize * available / needed)}px`, 'important');
    }
    const benefits = page.querySelector('.pass-hero-outcomes');
    if (benefits) {
      ['font-size','width'].forEach(p => benefits.style.removeProperty(p));
      const items=[...benefits.querySelectorAll('.pass-outcome-item')];
      items.forEach(item=>item.style.removeProperty('white-space'));
      const narrow = phone || innerWidth <= 700;
      benefits.dataset.benefitLayout = narrow ? 'stacked' : 'grid';
      // A grid is centred by its full, equal-width columns, never by the width of
      // one long sentence. Phones use a single generously sized reading measure.
      const available=benefits.parentElement.clientWidth;
      if (!narrow) {
        const unit=parseFloat(getComputedStyle(benefits).fontSize)/30;
        benefits.style.setProperty('width', `${Math.min(available,1100*unit)}px`, 'important');
      } else {
        const limit=Math.max(1,available-Math.min(24,available*.06));
        benefits.style.setProperty('width', `${limit}px`, 'important');
        // Trim only genuine unused line-end space, without adding new wraps.
        const originalHeight=benefits.offsetHeight, box=benefits.getBoundingClientRect();
        const scale=box.width/Math.max(1,benefits.offsetWidth);
        let right=box.left;
        items.forEach(item=>{
          const range=document.createRange();range.selectNodeContents(item);
          for(const r of range.getClientRects()) if(r.width>0)right=Math.max(right,r.right);
        });
        const fitted=Math.min(limit,Math.max(limit*.92,Math.ceil((right-box.left)/scale+4)));
        benefits.style.setProperty('width', `${fitted}px`, 'important');
        if(benefits.offsetHeight>originalHeight+1)benefits.style.setProperty('width', `${limit}px`, 'important');
      }
    }
    fitSingleLine(page.querySelector('#pass-use-title'), 12);
    const grid = page.querySelector('.pass-proof-grid');
    if (grid) grid.style.removeProperty('--wmol-proof-head-height');
    // The excerpt controller measures every slide, not just the active one.
    if (window.wmolFitTestimonialSet) window.wmolFitTestimonialSet();
  }
  function schedule() { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {raf=0; syncPass();}); }
  function init() {
    schedule();
    window.addEventListener('resize', schedule, {passive:true});
    window.addEventListener('pageshow', schedule, {passive:true});
    window.addEventListener('wmol:portrait', schedule);
    window.addEventListener('wmol:viewport', schedule);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule, {passive:true});
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    // Re-measure after actual images are decoded, without substituting artwork.
    document.querySelectorAll('#wmol-medicine img').forEach(img => img.addEventListener('load', schedule, {once:true}));
    const page = document.querySelector('#wmol-medicine .pass-page');
    if (page && window.ResizeObserver) {
      let lastWidth = -1;
      new ResizeObserver(entries => {
        const width = entries[0].contentRect.width;
        if (Math.abs(width-lastWidth) > .5) {lastWidth=width;schedule();}
      }).observe(page);
      const excerptCard = page.querySelector('.testimonial-card');
      if (excerptCard && !document.documentElement.classList.contains('wmol-phone-device')) {
        let lastHeight = -1;
        new ResizeObserver(() => {
          const height = excerptCard.offsetHeight;
          if (Math.abs(height - lastHeight) > .5) {lastHeight = height; schedule();}
        }).observe(excerptCard);
      }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
  else init();
})();
    </script>

    <script>
    (() => {
      const root = document.documentElement;
      if (!root.classList.contains('wmol-phone-device')) return;
      const panels = [...document.querySelectorAll('.domains-page .wml-rail')];
      if (!panels.length) return;
      const scroller = document.querySelector('.domains-page .wml-home');
      const fallback = ['#020826','#202425','#3e422f','#171717'];
      const colors = [...fallback];
      function update() {
        if (window.wmolZoomIsActive && window.wmolZoomIsActive()) return;
        const index = Math.max(0, Math.min(panels.length-1, Math.round(scroller.scrollLeft / Math.max(1,scroller.clientWidth))));
        root.style.setProperty('--wmol-active-panel-color', colors[index]);
      }
      panels.forEach((panel,i) => {
        panel.style.setProperty('--wmol-panel-color', colors[i]);
        const imageCSS = getComputedStyle(panel,'::before').backgroundImage;
        const url = /url\(["']?([^"')]+)["']?\)/.exec(imageCSS);
        if (!url) return;
        const img = new Image();
        img.onload = () => {
          try {
            // Read only this site's original poster's corner, not its artwork.
            const canvas=document.createElement('canvas');canvas.width=1;canvas.height=1;
            const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,Math.max(1,img.width*.01),Math.max(1,img.height*.01),0,0,1,1);
            const p=ctx.getImageData(0,0,1,1).data;
            if(p[3]<250)return;
            colors[i]=`rgb(${p[0]}, ${p[1]}, ${p[2]})`;
            panel.style.setProperty('--wmol-panel-color',colors[i]);update();
          } catch (_) { /* Keep the safe panel-specific fallback. */ }
        };
        img.src=url[1];
      });
      scroller.addEventListener('scroll', update, {passive:true});
      window.addEventListener('wmol:viewport', update);update();
    })();
    </script>
  </body>
